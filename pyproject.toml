[project]
name = "gdn-chatbot"
version = "0.1.0"
description = "Secure, retrieval-augmented chat API for Global Digital Nexus"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "slowapi>=0.1.9,<1",
  "langchain>=0.3,<1",
  "langchain-community>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "langchain-chroma>=0.1,<1",
  "langchain-huggingface>=0.1,<1",
  "langchain-text-splitters>=0.3,<1",
  "sentence-transformers>=3,<6",
  "chromadb>=0.5,<2",
  "firecrawl-py>=2,<3",
  "redis>=5,<6",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
